<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#101827"/>
    </linearGradient>
    <linearGradient id="safe" x1="0" x2="1">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect x="20" y="20" width="1160" height="860" rx="22" fill="#162436" stroke="#2a3d56"/>

  <rect x="40" y="40" width="1120" height="78" rx="18" fill="#0b1320" stroke="#243955"/>
  <circle cx="90" cy="79" r="18" fill="#60a5fa"/>
  <text x="128" y="88" font-size="32" font-family="Arial, sans-serif" fill="#eaf2ff" font-weight="700">Invoice Notice</text>
  <text x="980" y="88" font-size="22" font-family="Arial, sans-serif" fill="#94a3b8">10:12</text>

  <rect x="70" y="170" width="420" height="96" rx="18" fill="#1d2b3a"/>
  <text x="100" y="228" font-size="28" font-family="Arial, sans-serif" fill="#d1fae5">Safe routine message</text>

  <rect x="70" y="300" width="1060" height="260" rx="18" fill="#121c2a" stroke="#2d465d"/>
  <text x="96" y="355" font-size="31" font-family="Arial, sans-serif" fill="#e2e8f0">Your invoice for ₹1,250 is ready for review.</text>
  <text x="96" y="402" font-size="31" font-family="Arial, sans-serif" fill="#e2e8f0">Please confirm receipt by Friday, 5 PM.</text>
  <text x="96" y="448" font-size="31" font-family="Arial, sans-serif" fill="#e2e8f0">No codes, passwords, or payment links were requested.</text>
  <text x="96" y="495" font-size="31" font-family="Arial, sans-serif" fill="#94a3b8">If you need help, log in to the official portal using our website.</text>

  <rect x="70" y="600" width="360" height="76" rx="18" fill="url(#safe)"/>
  <text x="150" y="648" font-size="28" font-family="Arial, sans-serif" fill="#fff" font-weight="700">SAFE</text>

  <rect x="820" y="170" width="270" height="120" rx="18" fill="#1e293b" stroke="#374151"/>
  <text x="855" y="218" font-size="24" font-family="Arial, sans-serif" fill="#cbd5e1">Risk signal</text>
  <text x="855" y="260" font-size="50" font-family="Arial, sans-serif" fill="#34d399" font-weight="700">12</text>

  <rect x="820" y="315" width="270" height="120" rx="18" fill="#1e293b" stroke="#374151"/>
  <text x="855" y="360" font-size="24" font-family="Arial, sans-serif" fill="#cbd5e1">Verification</text>
  <text x="855" y="405" font-size="42" font-family="Arial, sans-serif" fill="#86efac" font-weight="700">Low</text>
</svg>
